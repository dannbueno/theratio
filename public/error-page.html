<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheRatio - Diagnóstico</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: white;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #ff5722;
    }
    pre {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 5px;
      text-align: left;
      overflow: auto;
      max-height: 300px;
    }
    .button {
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }
    #error-details {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TheRatio - Página de Diagnóstico</h1>
    <p>Esta página ayuda a diagnosticar problemas con la aplicación TheRatio.</p>
    
    <div>
      <h2>Información del navegador:</h2>
      <pre id="browser-info">Cargando...</pre>
    </div>
    
    <div>
      <h2>Estado de la red:</h2>
      <pre id="network-info">Cargando...</pre>
    </div>
    
    <div>
      <h2>Intentar cargar recursos:</h2>
      <pre id="resource-test">Cargando...</pre>
    </div>
    
    <button class="button" id="test-btn">Ejecutar pruebas</button>
    
    <div id="error-details"></div>
  </div>

  <script>
    document.getElementById('browser-info').textContent = `
User Agent: ${navigator.userAgent}
Plataforma: ${navigator.platform}
Cookies habilitadas: ${navigator.cookieEnabled}
Lenguaje: ${navigator.language}
Online: ${navigator.onLine}
`;

    async function testNetwork() {
      try {
        const networkInfo = document.getElementById('network-info');
        networkInfo.textContent = 'Probando conexión...';
        
        const startTime = performance.now();
        const response = await fetch('https://theratio.netlify.app', {
          method: 'HEAD',
          cache: 'no-store'
        });
        const endTime = performance.now();
        
        networkInfo.textContent = `
Estado: ${response.status} ${response.statusText}
Tiempo de respuesta: ${Math.round(endTime - startTime)}ms
Headers: ${JSON.stringify(Object.fromEntries([...response.headers]), null, 2)}
`;
      } catch (error) {
        document.getElementById('network-info').textContent = `Error: ${error.message}`;
      }
    }

    async function testResources() {
      const resourceTest = document.getElementById('resource-test');
      resourceTest.textContent = 'Probando recursos...';
      
      try {
        const results = [];
        
        // Probar carga de /.next/index
        try {
          const indexRes = await fetch('/.next/index', { cache: 'no-store' });
          results.push(`/.next/index: ${indexRes.status} ${indexRes.statusText}`);
        } catch (e) {
          results.push(`/.next/index: Error - ${e.message}`);
        }
        
        // Probar carga de /_next/static
        try {
          const staticRes = await fetch('/_next/static', { cache: 'no-store' });
          results.push(`/_next/static: ${staticRes.status} ${staticRes.statusText}`);
        } catch (e) {
          results.push(`/_next/static: Error - ${e.message}`);
        }
        
        // Probar carga de /.netlify/functions/next
        try {
          const netlifyRes = await fetch('/.netlify/functions/next', { cache: 'no-store' });
          results.push(`/.netlify/functions/next: ${netlifyRes.status} ${netlifyRes.statusText}`);
        } catch (e) {
          results.push(`/.netlify/functions/next: Error - ${e.message}`);
        }
        
        resourceTest.textContent = results.join('\n');
      } catch (error) {
        resourceTest.textContent = `Error general: ${error.message}`;
      }
    }

    document.getElementById('test-btn').addEventListener('click', async () => {
      await testNetwork();
      await testResources();
      
      // Mostrar errores de consola
      const errorDiv = document.getElementById('error-details');
      errorDiv.innerHTML = '<h2>Errores en consola:</h2><pre id="console-errors">Registrando errores...</pre>';
      
      const originalConsoleError = console.error;
      const errors = [];
      
      console.error = function() {
        errors.push(Array.from(arguments).join(' '));
        document.getElementById('console-errors').textContent = errors.join('\n');
        originalConsoleError.apply(console, arguments);
      };
      
      window.onerror = function(message, source, lineno, colno, error) {
        const errorText = `${message} at ${source}:${lineno}:${colno}`;
        errors.push(errorText);
        document.getElementById('console-errors').textContent = errors.join('\n');
        return false;
      };
    });
  </script>
</body>
</html>
